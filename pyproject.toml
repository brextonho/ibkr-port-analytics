[project]
name = "portfolio"
version = "0.2.0"
description = "Personal IBKR portfolio analytics: Flex ingest → SQLite → FastAPI + React dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ibflex>=0.16",
    "pandas>=2.2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "yfinance>=0.2.40",
]

[project.scripts]
portfolio = "portfolio.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
