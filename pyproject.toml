[project]
name = "ibkr-port-analytics"
version = "0.1.0"
description = "Workspace root for the IBKR portfolio analytics system (ingestion ETL + read API)"
requires-python = ">=3.12"
dependencies = ["ingestion", "api"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv.workspace]
members = ["ingestion", "api"]

[tool.uv.sources]
ingestion = { workspace = true }
api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
