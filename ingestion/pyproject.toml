[project]
name = "ingestion"
version = "0.1.0"
description = "IBKR Flex ETL: fetch, transform, compute analytics, load to Postgres"
requires-python = ">=3.11"
dependencies = [
    "ibflex>=0.16",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "yfinance>=0.2.40",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
