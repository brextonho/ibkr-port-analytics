# Copy to config/config.yaml (gitignored) to change any of these. Every key is
# optional; the values shown are the defaults. Secrets go in .env, not here.

database: portfolio.db      # SQLite file (or any SQLAlchemy URL)
base_currency: SGD
benchmark: VWRA.L           # Yahoo Finance ticker; converted to base currency
risk_free_rate: 0.0         # annual, for Sharpe and Sortino
lookback_days: 14           # days re-fetched before the last pull; heals missed runs
retry:
  attempts: 5               # when IB says the statement isn't ready yet
  backoff_seconds: 30       # doubles each attempt
